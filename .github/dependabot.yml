# Weekly dependency updates. A compromised or vulnerable package is the main way a browser app like this
# could leak an API key, so updates arrive as pull requests that run the tests before anything merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
